<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Project: FLASK</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
      #game { width: 100%; height: 100%; display: block; }
      /* iOS セーフエリア対応 */
      @supports (padding: max(0px)) {
        body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Phaser をグローバルに公開（rexUI プラグインが期待するため） -->
    <script type="module">
      import Phaser from 'phaser'
      window.Phaser = Phaser
      console.log('Phaser global set:', !!window.Phaser)
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
